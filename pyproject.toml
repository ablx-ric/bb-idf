[project]
name = "bb-idf"
version = "0.1.0"
description = "Sistema de evaluacion cientifica para comparar TF-IDF, TextRank y BB-IDF sobre corpus en espanol"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "marimo>=0.23.13",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pingouin>=0.6.1",
    "pandas>=2.2.0",
    "polars>=1.42.1",
    "pymupdf>=1.28.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "spacy>=3.8.14",
    "wordcloud>=1.9.6",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bb_idf", "bb_idf.*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
